name: Build Mojave play helper
on:
  push:
    paths: ['HTML/**', 'scripts/distribution.mjs', 'tests/native-distribution.mjs', 'scripts/macos/**', 'scripts/build-mojave.mjs', 'scripts/prepare-mojave-test.mjs', 'tests/mojave-esr-browser.mjs', 'tests/native-folder-browser.mjs', 'tests/offline-html/information-browser.mjs', 'GAME-PORTAL.html', '.github/workflows/mojave-helper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mojave:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/build-mojave.mjs
      - run: node scripts/verify-mojave.mjs
      - run: node tests/native-distribution.mjs
        env:
          PORTAL_NATIVE_EXE: GAME-PORTAL-MOJAVE
      - run: node scripts/prepare-mojave-test.mjs
      - run: node tests/mojave-esr-browser.mjs
      - run: node tests/mojave-esr-browser.mjs
        env:
          PORTAL_MOJAVE_EDITION: player
      - run: npx playwright install firefox
      - run: node tests/native-folder-browser.mjs
        env:
          PORTAL_NATIVE_EXE: GAME-PORTAL-MOJAVE
          PORTAL_BROWSER: firefox
      - run: node tests/native-folder-browser.mjs
        env:
          PORTAL_NATIVE_EXE: GAME-PORTAL-MOJAVE
          PLAYWRIGHT_EXECUTABLE_PATH: .tools/mojave-test/chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing
          PORTAL_EXPECT_BROWSER: '116.'
      - run: node tests/offline-html/editions-browser.mjs
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: .tools/mojave-test/chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing
      - run: node tests/offline-html/information-browser.mjs
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: .tools/mojave-test/chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing
      - uses: actions/upload-artifact@v4
        with:
          name: GAME-PORTAL-MOJAVE-Intel
          path: |
            GAME-PORTAL-MOJAVE
            GAME-PORTAL-MOJAVE.app/**
            GAME-PORTAL-PLAY-MOJAVE.app/**
          if-no-files-found: error
