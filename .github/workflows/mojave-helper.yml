name: Build Mojave play helper
on:
  push:
    paths: ['HTML/**', 'scripts/distribution.mjs', 'tests/native-distribution.mjs', 'scripts/macos/**', 'scripts/build-mac-apps.mjs', 'desktop/bootstrap.js', 'desktop/page.mjs', 'tests/mac-desktop.mjs', 'package-lock.json', 'scripts/build-mojave.mjs', 'scripts/prepare-mojave-test.mjs', 'tests/mojave-esr-browser.mjs', 'tests/native-folder-browser.mjs', 'tests/offline-html/information-browser.mjs', 'GAME-PORTAL.html', '.github/workflows/mojave-helper.yml']
  workflow_dispatch:
    inputs:
      use_prebuilt:
        description: Test committed EXE and APP files without rebuilding them
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  mojave:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        if: inputs.use_prebuilt
        with:
          path: .tools/offline-runtime
          key: pyxel-runtime-${{ hashFiles('offline-html/runtime-lock.json') }}
      - run: npm run prepare:runtime
        if: inputs.use_prebuilt
      - run: git diff --exit-code -- ':(glob)HTML/**/*.html' THIRD-PARTY-LICENSES.txt
        if: inputs.use_prebuilt
      - run: node --import ./scripts/ci-failure-diagnostics.mjs scripts/verify-distribution.mjs
        if: inputs.use_prebuilt
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/mac-loopback.mjs
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/mac-files.mjs
      - uses: actions/cache@v4
        if: ${{ !inputs.use_prebuilt }}
        id: cef-cache
        with:
          path: .tools/cef
          key: cef-mac-v2-macos-15-intel-${{ runner.arch }}-${{ hashFiles('scripts/macos/cef-lock.json') }}
      - run: node --import ./scripts/ci-native-build-trace.mjs scripts/build-mojave.mjs
        if: ${{ !inputs.use_prebuilt }}
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && !inputs.use_prebuilt && steps.cef-cache.outputs.cache-hit != 'true'
        with:
          path: .tools/cef
          key: cef-mac-v2-macos-15-intel-${{ runner.arch }}-${{ hashFiles('scripts/macos/cef-lock.json') }}
      - run: node scripts/verify-mojave.mjs
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/mac-desktop.mjs
        timeout-minutes: 6
        env:
          PORTAL_MAC_SUFFIX: MOJAVE
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/native-distribution.mjs
        env:
          PORTAL_NATIVE_EXE: GAME-PORTAL-MOJAVE
      - run: node scripts/prepare-mojave-test.mjs
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/mojave-esr-browser.mjs
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/mojave-esr-browser.mjs
        env:
          PORTAL_MOJAVE_EDITION: player
      - run: npx playwright install firefox
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/native-folder-browser.mjs
        env:
          PORTAL_NATIVE_EXE: GAME-PORTAL-MOJAVE
          PORTAL_BROWSER: firefox
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/native-folder-browser.mjs
        env:
          PORTAL_NATIVE_EXE: GAME-PORTAL-MOJAVE
          PLAYWRIGHT_EXECUTABLE_PATH: .tools/mojave-test/chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing
          PORTAL_EXPECT_BROWSER: '116.'
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/offline-html/editions-browser.mjs
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: .tools/mojave-test/chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/offline-html/information-browser.mjs
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: .tools/mojave-test/chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing
      - name: Publish verified native build tree
        if: ${{ !inputs.use_prebuilt }}
        run: node scripts/export-native-build.mjs legacy
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.use_prebuilt }}
        with:
          name: GAME-PORTAL-MOJAVE-Intel
          path: |
            GAME-PORTAL-MOJAVE
            GAME-PORTAL-MOJAVE.app/**
            GAME-PORTAL-PLAY-MOJAVE.app/**
          if-no-files-found: error
