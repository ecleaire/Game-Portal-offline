name: Build and test offline HTML launcher
on:
  workflow_dispatch:
    inputs:
      verify_public_download:
        description: Verify the actual public main Code ZIP and launch its HTML editions
        type: boolean
        default: false
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-download:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_public_download
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: mkdir -p .tools
      - run: curl --fail --location --retry 2 --connect-timeout 30 --max-time 600 --max-filesize 1200000000 --output .tools/public-main.zip https://github.com/ecleaire/Game-Portal-offline/archive/refs/heads/main.zip
      - run: node scripts/verify-code-zip.mjs .tools/public-main.zip
      - run: npx playwright install --with-deps chromium
      - run: node tests/public-code-zip.mjs .tools/public-main.zip
  browser:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_public_download
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .tools/offline-runtime
          key: pyxel-runtime-${{ hashFiles('offline-html/runtime-lock.json') }}
      - run: npm run prepare:runtime
      - run: node scripts/verify-distribution.mjs
      - run: git archive --format=zip --output=.tools/distribution-check.zip HEAD
      - run: node scripts/verify-code-zip.mjs .tools/distribution-check.zip
      - run: node tests/helper-entrypoints.mjs
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: npm run build:windows
        if: matrix.os == 'windows-latest'
      - run: npm run test:native
        if: matrix.os == 'windows-latest'
      - run: node tests/native-distribution.mjs
        if: matrix.os == 'windows-latest'
      - run: npm run test:native-folder
        if: matrix.os == 'windows-latest'
      - run: node scripts/verify-distribution.mjs
      # Native PE build metadata changes when the helper is compiled on a runner.
      # verify-distribution checks role copies; generated HTML must be byte-stable.
      - run: git diff --exit-code -- ':(glob)HTML/**/*.html' THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: GAME-PORTAL-HTML
          path: |
            offline-release/GAME-PORTAL.html
            offline-release/GAME-PORTAL-PLAY.html
            offline-release/README.txt
            offline-release/START-HERE.txt
            offline-release/THIRD-PARTY-LICENSES.txt
            offline-release/GAME-PORTAL-HTML.zip
            offline-release/GAME-PORTAL-WINDOWS.exe
            offline-release/GAME-PORTAL-WINDOWS.zip
            offline-release/README-WINDOWS.txt
          if-no-files-found: error
