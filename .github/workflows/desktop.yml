name: Build and test Windows desktop prototype
on:
  push:
    paths: ['HTML/**', 'scripts/distribution.mjs', 'tests/native-distribution.mjs', 'desktop/**', 'scripts/build-desktop.mjs', 'scripts/verify-desktop.mjs', 'scripts/windows/native-launcher.cs', 'tests/desktop*', 'GAME-PORTAL.html', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      use_prebuilt:
        description: Test committed EXE and APP files without rebuilding them
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        if: inputs.use_prebuilt
        with:
          path: .tools/offline-runtime
          key: pyxel-runtime-${{ hashFiles('offline-html/runtime-lock.json') }}
      - run: npm run prepare:runtime
        if: inputs.use_prebuilt
      - run: git diff --exit-code -- ':(glob)HTML/**/*.html' THIRD-PARTY-LICENSES.txt
        if: inputs.use_prebuilt
      - run: node --import ./scripts/ci-failure-diagnostics.mjs scripts/verify-distribution.mjs
        if: inputs.use_prebuilt
      - run: node scripts/build-desktop.mjs --prepare
        if: ${{ !inputs.use_prebuilt }}
      - run: node scripts/verify-desktop.mjs
      - run: node --import ./scripts/ci-failure-diagnostics.mjs scripts/build-windows.mjs
        if: ${{ !inputs.use_prebuilt }}
      - run: npx playwright install chromium
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/windows-native.mjs
        env:
          PORTAL_NATIVE_HTML: ${{ inputs.use_prebuilt && 'GAME-PORTAL.html' || '' }}
          PORTAL_NATIVE_EXE: ${{ inputs.use_prebuilt && 'GAME-PORTAL-WINDOWS.exe' || '' }}
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/desktop-files.mjs
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/desktop-browser.mjs
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/desktop-player.mjs
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/desktop-information.mjs
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/desktop-forget.mjs
      - run: npm run prepare:test-games
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/desktop-godot.mjs
      - name: Publish verified native build tree
        if: ${{ !inputs.use_prebuilt }}
        run: node scripts/export-native-build.mjs windows
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.use_prebuilt }}
        with:
          name: GAME-PORTAL-desktop-prototype
          path: |
            GAME-PORTAL.exe
            GAME-PORTAL-PLAY.exe
            DESKTOP-LICENSES.txt
          if-no-files-found: error
