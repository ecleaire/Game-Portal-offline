name: Build Mac portable helper
on:
  push:
    paths:
      - 'HTML/**'
      - 'scripts/distribution.mjs'
      - 'tests/native-distribution.mjs'
      - 'scripts/macos/**'
      - 'scripts/build-macos.mjs'
      - 'scripts/build-mac-apps.mjs'
      - 'scripts/prepare-cef.mjs'
      - 'desktop/bootstrap.js'
      - 'desktop/page.mjs'
      - 'tests/mac-desktop.mjs'
      - 'package-lock.json'
      - 'scripts/mac-system.mjs'
      - 'scripts/verify-mac-system.mjs'
      - 'scripts/verify-editions.mjs'
      - 'tests/native-folder-browser.mjs'
      - 'tests/offline-html/folder-comfort-browser.mjs'
      - 'tests/offline-html/loading-cancel-browser.mjs'
      - 'offline-html/read-task.js'
      - 'offline-html/library.js'
      - 'offline-html/native-tools.js'
      - 'offline-html/app.js'
      - 'offline-html/index.html'
      - 'GAME-PORTAL.html'
      - 'package.json'
      - '.github/workflows/macos-helper.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: cef-cache
        with:
          path: .tools/cef
          key: cef-mac-v2-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/macos/cef-lock.json') }}
      - run: node scripts/build-macos.mjs
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && steps.cef-cache.outputs.cache-hit != 'true'
        with:
          path: .tools/cef
          key: cef-mac-v2-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/macos/cef-lock.json') }}
      - run: node scripts/verify-mac-system.mjs
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/mac-desktop.mjs
        timeout-minutes: 6
        env:
          PORTAL_CEF_TEST_GL: ${{ runner.arch == 'ARM64' && 'gl' || '' }}
      - run: npx playwright install chromium
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/native-distribution.mjs
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/native-folder-browser.mjs
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/offline-html/folder-comfort-browser.mjs
      - run: node --import ./scripts/ci-failure-diagnostics.mjs tests/offline-html/loading-cancel-browser.mjs
      - name: Publish verified native build tree
        if: matrix.os == 'macos-15-intel'
        run: node scripts/export-mac-build.mjs modern
      - uses: actions/upload-artifact@v4
        with:
          name: GAME-PORTAL-MAC-universal-${{ matrix.os }}
          path: |
            GAME-PORTAL-MAC
            GAME-PORTAL-MAC.app/**
            GAME-PORTAL-PLAY-MAC.app/**
            GAME-PORTAL-MOJAVE.app/**
            GAME-PORTAL-PLAY-MOJAVE.app/**
          if-no-files-found: error
