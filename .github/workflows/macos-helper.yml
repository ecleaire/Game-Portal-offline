name: Build Mac portable helper
on:
  push:
    paths:
      - 'scripts/macos/**'
      - 'scripts/build-macos.mjs'
      - 'tests/native-folder-browser.mjs'
      - 'tests/offline-html/folder-comfort-browser.mjs'
      - 'tests/offline-html/loading-cancel-browser.mjs'
      - 'offline-html/read-task.js'
      - 'offline-html/library.js'
      - 'offline-html/native-tools.js'
      - 'offline-html/app.js'
      - 'offline-html/index.html'
      - 'GAME-PORTAL.html'
      - 'package.json'
      - '.github/workflows/macos-helper.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/build-macos.mjs
      - run: npx playwright install chromium
      - run: node tests/native-folder-browser.mjs
      - run: node tests/offline-html/folder-comfort-browser.mjs
      - run: node tests/offline-html/loading-cancel-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: GAME-PORTAL-MAC-universal-${{ matrix.os }}
          path: GAME-PORTAL-MAC
          if-no-files-found: error
